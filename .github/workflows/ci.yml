name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # v2.12.0 修复:补 workflow_dispatch —— 否则 github.event.inputs.skills_dir
  # 永远为空,"Rebuild skill tree" 步骤是死代码。手动触发时可传入本机技能目录路径。
  workflow_dispatch:
    inputs:
      skills_dir:
        description: "可选:技能目录绝对路径(传入则重建索引;留空只校验已提交索引)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKILLS_DIR: ${{ github.event.inputs.skills_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      # 若显式传入 SKILLS_DIR 且目录存在，则重新生成索引并校验；
      # 否则（GitHub runner 无本机技能目录）只校验已提交的索引文件。
      - name: Rebuild skill tree (optional, only if SKILLS_DIR provided)
        if: ${{ env.SKILLS_DIR != '' }}
        run: |
          if [ ! -d "$SKILLS_DIR" ]; then
            echo "SKILLS_DIR set but not found: $SKILLS_DIR"
            exit 1
          fi
          python scripts/build_skill_tree.py

      - name: Validate committed skill tree index
        run: |
          python -m json.tool skill_tree.json > /dev/null
          python -c "
          import json
          with open('skill_tree.json') as f:
              tree = json.load(f)
          assert tree['total'] > 0, 'skill_tree.json indexed 0 skills'
          assert len(tree['categories']) > 0, 'No categories in index'
          # 自洽校验：每个技能至少归入一个分类，故分类条数和应 >= total
          # （此检查可拦截“total 与真实索引不一致”的手写数据问题）
          cat_sum = sum(len(v) for v in tree['categories'].values())
          assert cat_sum >= tree['total'], f'Index inconsistent: category sum ({cat_sum}) < total ({tree[\"total\"]})'
          assert 'version' in tree and tree['version'], 'skill_tree.json missing version'
          print(f'✓ Validated {tree[\"total\"]} skills across {len(tree[\"categories\"])} categories (cat_sum={cat_sum})')
          "

      - name: Validate SKILL.md frontmatter & version consistency
        run: |
          python -c "
          import re, json
          content = open('SKILL.md', encoding='utf-8').read()
          m = re.search(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
          assert m, 'SKILL.md missing YAML frontmatter'
          fm = m.group(1)
          mv = re.search(r'^version:\s*(\S+)', fm, re.MULTILINE)
          assert mv, 'SKILL.md frontmatter missing version'
          tree = json.load(open('skill_tree.json'))
          assert tree.get('version') == mv.group(1), \
              f'version mismatch: SKILL.md={mv.group(1)} vs skill_tree.json={tree.get(\"version\")}'
          # v2.12.0:正文头部版本号也纳入校验(此前只校验 frontmatter,正文 v2.8.0 残留未被发现)
          body_v = re.search(r'\*\*v(\d+\.\d+\.\d+)\*\*', content)
          assert body_v, 'SKILL.md body missing version marker (**vX.Y.Z**)'
          assert body_v.group(1) == mv.group(1), \
              f'body version mismatch: body={body_v.group(1)} vs frontmatter={mv.group(1)}'
          print(f'✓ SKILL.md frontmatter+body OK (version {mv.group(1)} matches skill_tree.json)')
          "

      # v2.12.0:零依赖回归测试(同义词扩展/SAD 检索/Layer D/编排兼容/词边界修复)
      - name: Run regression tests
        run: python scripts/tests/run_tests.py
